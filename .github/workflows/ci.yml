name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, types, fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: flake8 src tests
      - run: mypy
      - run: pytest -m "not slow"

  validation:
    name: Validate against GME prices (slow)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m slow -v --durations=0

  docker:
    name: Docker image + API smoke test
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pun-clearing .
      - run: docker run -d --name pun-api -p 8000:8000 pun-clearing
      - name: Wait for the API
        run: timeout 60 sh -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - name: Clear hour 24 and compare with GME
        run: |
          curl -sf localhost:8000/clear/20100504/24 | tee result.json
          python3 -c "import json; r = json.load(open('result.json')); \
            assert abs(r['pun_model'] - r['pun_real']) < 1e-5, r; \
            assert r['market_split'] and len(r['zonal_prices']) == 6, r"
      - if: failure()
        run: docker logs pun-api
